    details:
      - Conception de l'architecture d'une app full-stack de stockage de fichiers et d'une API REST
      - Découverte d'Express.js, TypeScript, Node.js et MongoDB
      - Développement d'une API REST complète (serveur/client)
      - Accentuation sur la modularité et la maintenabilité
  - title: Simulateur de vie particulaire

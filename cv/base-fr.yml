projects:
  - title: JSpec - Un processeur d'annotations Java pour la programmation par contrat
    date: juin - juill 2025
    context: Stage au laboratoire IRIT, outil pédagogique pour 1A
    details:
      - Développement d'un processeur d'annotations Java pour générer des assertions à l'exécution à partir de spécifications de type JML
      - Conception d'un langage dédié (DSL) pour exprimer des pré/postconditions et invariants avec une grammaire ANTLR
      - Implémentation d'un processus de manipulation de l'AST JavaC en plusieurs passes pour générer du bytecode supplémentaire à la compilation
  - title: bun-ffi-extra - Une extension FFI pour Bun qui permet l'utilisation de structs, pointeurs et unions C
    date: mars - juin 2026
    context: Utilisation personnelle pour la récriture d'un projet C en TS
    details:
      - Développement d'une extension TypeScript pour la FFI de Bun afin de permettre une interopérabilité directe avec les types dérivés du C
      - Utilisation de l'expressivité du système de types de TypeScript pour décrire correctement les types C
      - Conception de calculs de disposition mémoire personnalisés et d'un mappage des vues de données pour assurer l'alignement entre la mémoire C et les objets TypeScript
      - Création d'une suite complète de tests d'intégration intégrée à un workflow CI
      - Versionnement et distribution du paquet sur le registre NPM
  - title: Dotfiles - Configuration très custom en constante évolution
    date: juin 2024 - présent
    context: Utilisation personnelle
    details:
      - Configuration d'i3wm, Tmux et Neovim pour un workflow rapide centré sur le clavier
      - Développement de scripts Bash analysant les mécanismes internes de Git pour automatiser la configuration des environnements Tmux
      - Création d'un prompt shell dynamique suivant l'état de Git, les connexions SSH et le statut du VPN
      - Création de scripts dmenu personnalisés pour le lancement d'applications et la gestion de l'alimentation du système
  - title: HaGymont - Application Web Full-Stack de gestion de salle de sport
    date: "2026"
    context: ENSEEIHT, projet de groupe du cours d'Application Web
    details:
      - Backend en Spring Boot, authentification JWT, persistance JPA (MySQL)
      - Frontend en React, TailwindCSS
      - Intégration d'un chatbot via l'API Gemini
      - Documentation détaillée de l'API backend (SpringDoc)
  - title: Schwarzwald - Application Cloud Full-Stack d'organisation de voyage
    date: 2025 - 2026
    context: Hochshule Konstanz, projet de groupe du cours de développement cloud
    details:
      - Backend en Express.js et Prisma (Postgres)
      - Frontend en Next.js, React et Tailwind
      - Déploiement sur Google Cloud utilisant Docker, Cloud Run, Cloud SQL, Terraform et Firestore
      - Intégration CI/CD avec GitHub Actions
  - title: PageRank - Algorithme de routage et classement réseau
    date: "2023"
    context: ENSEEIHT, Projet de groupe de Programmation Impérative (PIM)
    details:
      - Implémentation de l'algo de PageRank entièrement en Ada
      - Conception et évaluation des performances d'implémentation de matrices creuses et pleines
      - Optimisation de l'utilisation de la mémoire et des performances en focntions des résultats d'évaluation
      - Lecture de fichier et extractions de données avec un paquet E/S personnalisé
      - Rédaction d'un rapport technique et architectural complet
  - title: Cloud Hervy - Clone de Google Drive
    date: "2024"
